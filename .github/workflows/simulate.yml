name: simulate-homing
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-servo-homing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulation
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          python simulate.py | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Regenerate plot
        run: pip install matplotlib && python plot.py
      - uses: actions/upload-artifact@v4
        with:
          name: repeatability
          path: 01-servo-homing/repeatability.svg
