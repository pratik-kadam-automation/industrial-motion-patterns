<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 12 12" markerWidth="6" markerHeight="6" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/></marker>
<marker id="r" viewBox="0 0 12 12" markerWidth="6" markerHeight="6" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f87171"/></marker></defs>
<rect width="1080" height="580" fill="#0f172a"/>
<text x="540" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#fff">4-step homing as a state machine</text>
<g font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">
<rect x="30" y="130" width="130" height="90" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="3"/><text x="95" y="183">IDLE</text>
<rect x="230" y="130" width="160" height="90" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="310" y="170">1 FAST</text><text x="310" y="198">SEARCH</text>
<rect x="460" y="130" width="160" height="90" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/><text x="540" y="170">2 BACK</text><text x="540" y="198">OFF</text>
<rect x="690" y="130" width="140" height="90" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/><text x="760" y="183">3 CREEP</text>
<rect x="900" y="130" width="140" height="90" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="3"/><text x="970" y="170">4 ZERO</text><text x="970" y="198">SET</text>
<rect x="800" y="360" width="170" height="80" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="3"/><text x="885" y="408">DONE</text>
<rect x="400" y="380" width="280" height="80" rx="14" fill="#2a1518" stroke="#f87171" stroke-width="3"/><text x="540" y="427" fill="#fca5a5">FAULT: velocity = 0</text>
</g>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#a)">
<path d="M162,175 L224,175"/><path d="M392,175 L454,175"/><path d="M622,175 L684,175"/><path d="M832,175 L894,175"/>
<path d="M970,222 L920,354"/>
<path d="M885,442 L885,520 L95,520 L95,226" stroke-dasharray="8 6"/>
</g>
<g font-size="14" fill="#cbd5e1" text-anchor="middle">
<text x="193" y="160">Start</text><text x="423" y="160">sensor ON</text><text x="653" y="160">cleared</text><text x="863" y="160">sensor ON</text>
</g>
<g stroke="#f87171" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#r)"><path d="M540,318 L540,374"/></g>
<text x="540" y="290" text-anchor="middle" font-size="16" fill="#fca5a5">from ANY state:</text>
<text x="540" y="310" text-anchor="middle" font-size="16" fill="#fca5a5">limit hit, abort or timeout</text>
<text x="500" y="545" text-anchor="middle" font-size="15" fill="#94a3b8">Start released: DONE or FAULT returns to IDLE</text>
<text x="540" y="568" text-anchor="middle" font-size="16" fill="#94a3b8">Limit handling lives in PLC logic, so the axis protects itself even if the drive config is wrong.</text>
</svg>
